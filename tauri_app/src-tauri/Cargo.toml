[package]
name = "eeg-mdd-tauri-preview"
version = "1.1.0"
description = "Lightweight Tauri preview for EEG MDD risk inference."
authors = ["Glan Pierce"]
edition = "2021"

[lib]
name = "eeg_mdd_tauri_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-dialog = "=2.7.1"
